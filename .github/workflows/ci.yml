name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    name: Build & prove bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-ninja
            libdir: build/bin
          - os: ubuntu-latest
            preset: linux-ninja
            libdir: build/bin

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Put MSVC (cl) on PATH so the Ninja generator works without pinning a
      # specific Visual Studio version (robust across GitHub runner images).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure native core
        run: cmake --preset ${{ matrix.preset }}

      - name: Build native core
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run C++ unit tests (GoogleTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# smoke
        run: dotnet build app-csharp/smoke -c Release --nologo

      - name: Run C# smoke (P/Invoke -> geometry)
        shell: bash
        run: |
          set -ex
          # Locate the built assembly (output dir can be bin/Release or
          # bin/x64/Release depending on platform) instead of hardcoding it.
          out=$(dirname "$(find app-csharp/smoke/bin -name contourcam-smoke.dll | head -n1)")
          cp "${{ matrix.libdir }}"/*contourcam_core.* "$out"/
          ls -la "$out"
          dotnet "$out/contourcam-smoke.dll" samples/plate_pocket_holes.dxf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python smoke (ctypes -> geometry)
        run: python automation-python/smoke.py "${{ matrix.libdir }}" samples/plate_pocket_holes.dxf
